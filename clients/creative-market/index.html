<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CM SEO Pipeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500&display=swap">
<style>
:root {
  --bg:#F7F6F3;--surface:#FFFFFF;--text:#1C2024;--text-2:#6F7681;
  --text-3:#A1A7B0;--accent:#0E7490;--negative:#BE123C;--border:#E4E2DD;
  --font-d:'Outfit',system-ui,sans-serif;--font-b:'Inter',system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111318;--surface:#1C1F28;--text:#EDEDEC;--text-2:#8B919C;
  --text-3:#5C6370;--accent:#06B6D4;--negative:#FB7185;--border:#2C3040;
}}
:root[data-theme="dark"]{
  --bg:#111318;--surface:#1C1F28;--text:#EDEDEC;--text-2:#8B919C;
  --text-3:#5C6370;--accent:#06B6D4;--negative:#FB7185;--border:#2C3040;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);
  margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;
  padding:24px}
.gate{text-align:center;max-width:340px;width:100%}
.gate h1{font-family:var(--font-d);font-size:22px;font-weight:600;margin:0 0 6px}
.gate .sub{font-size:13px;color:var(--text-2);margin:0 0 32px}
.gate input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:6px;
  font-size:14px;background:var(--surface);color:var(--text);box-sizing:border-box;
  font-family:var(--font-b)}
.gate input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.gate button{width:100%;padding:12px;border:none;border-radius:6px;background:var(--accent);
  color:#fff;font-size:14px;font-weight:500;cursor:pointer;margin-top:12px;
  font-family:var(--font-b);transition:opacity .15s}
.gate button:hover{opacity:.9}
.gate button:disabled{opacity:.5;cursor:default}
.gate .remember{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);
  margin-top:14px;justify-content:center;cursor:pointer;min-height:44px}
.gate .remember input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.err{font-size:12px;color:var(--negative);margin-top:10px}
.branding{font-size:11px;color:var(--text-3);margin-top:40px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="gate" id="gate">
  <h1>CM SEO Pipeline</h1>
  <p class="sub">Enter your dashboard password</p>
  <form id="gform" method="post" action="#">
    <input type="text" name="username" value="creative-market" autocomplete="username" hidden aria-hidden="true" tabindex="-1">
    <input type="password" id="pw" name="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button id="btn" type="submit">Access Dashboard</button>
    <label class="remember"><input type="checkbox" id="remember"> Remember me on this device</label>
  </form>
  <div class="err" id="err" hidden></div>
  <div class="branding">Resonance SEO &middot; Client Dashboard</div>
</div>

    var inl=scripts.filter(function(s){return !s.src});
    function loadExt(list,cb){if(!list.length)return cb();var s=document.createElement('script');s.src=list[0].getAttribute('src');s.onload=function(){loadExt(list.slice(1),cb)};s.onerror=function(){loadExt(list.slice(1),cb)};document.head.appendChild(s)}
    loadExt(ext,function(){inl.forEach(function(orig){var s=document.createElement('script');s.textContent=orig.textContent;document.body.appendChild(s)})});
  }catch(e){
    console.error('Decrypt failed:',e);
    if(pwIn){try{localStorage.removeItem(RK)}catch(x){}err.textContent='Saved password no longer valid \u2014 please enter it again.'}
    else err.textContent='Incorrect password ('+e.name+')';
    err.hidden=false;
    btn.disabled=false;btn.textContent='Access Dashboard';
    document.getElementById('pw').select();
  }
}
document.getElementById('gform').addEventListener('submit',function(e){e.preventDefault();unlock()});
(function(){var s=saved();if(s){document.getElementById('remember').checked=true;unlock(s)}})();
</script>
